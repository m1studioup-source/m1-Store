<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APKVISION Admin Panel</title>

    <!-- Firebase Compatibility SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; }
        h1 { margin-bottom: 20px; color: #e52d42; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
        button { width: 100%; padding: 12px; background: #e52d42; color: #fff; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
        
        .google-btn { background: #4285F4; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #333; position: relative; }
        .dots-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 10px; width: auto; }
        
        .action-menu { display: none; position: absolute; right: 10px; top: 40px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); z-index: 10; min-width: 110px; }
        .action-menu.active { display: block; }
        .action-menu button { background: none; color: #fff; border: none; padding: 10px; text-align: left; width: 100%; font-weight: normal; font-size: 14px; border-bottom: 1px solid #333; }
        .action-menu button:last-child { border-bottom: none; }
        .action-menu button.delete-opt { color: #dc3545; }
        .action-menu button:hover { background: #333; }

        #admin-content { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Firebase Admin Control</h1>

        <!-- Google Login Card -->
        <div class="card" id="login-card" style="text-align: center;">
            <h3>Admin Authentication</h3>
            <p style="font-size: 13px; color: #aaa; margin: 10px 0 20px;">Sign in with authorized Admin Google Account.</p>
            <button class="google-btn" onclick="loginWithGoogle()">
                Sign in with Google
            </button>
            <div id="login-error" style="color: #dc3545; margin-top: 12px; font-size: 13px; display: none;"></div>
        </div>

        <!-- Protected Admin Dashboard -->
        <div id="admin-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <span id="user-email" style="color:#aaa; font-size:14px;"></span>
                <button onclick="logout()" style="width:auto; padding:6px 12px; background:#444;">Logout</button>
            </div>

            <div class="card">
                <h3 id="form-heading">Add New Game/App</h3>
                <form id="add-form" style="margin-top: 10px;">
                    <input type="hidden" id="edit-id" value="">
                    <input type="text" id="title" placeholder="Title" required>
                    <select id="type">
                        <option value="game">Game</option>
                        <option value="app">App</option>
                    </select>
                    <input type="text" id="version" placeholder="Version (e.g. v1.0)" required>
                    <input type="text" id="modInfo" placeholder="MOD Info">
                    <input type="text" id="iconUrl" placeholder="Icon Image URL" required>
                    <input type="text" id="downloadUrl" placeholder="Download Link" required>
                    <textarea id="description" placeholder="Description"></textarea>
                    <button type="submit" id="submit-btn">Publish to Firebase DB</button>
                    <button type="button" id="cancel-btn" onclick="resetForm()" style="background: #555; margin-top: 6px; display: none;">Cancel Edit</button>
                </form>
            </div>

            <div class="card">
                <h3>Database Items</h3>
                <div id="items-list" style="margin-top: 10px;">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // Main Admin Gmail Address
        const ADMIN_EMAIL = "YOUR_GMAIL_HERE@gmail.com"; 

        const firebaseConfig = {
            apiKey: "AIzaSyCX02HB-6CPKmkhGqtMhgj4o",
            authDomain: "m1-store-15383.firebaseapp.com",
            projectId: "m1-store-15383",
            storageBucket: "m1-store-15383.firebasestorage.app",
            messagingSenderId: "435946576127",
            appId: "1:435946576127:web:0597a624e9001b3ebc94ca"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Check auth status automatically
        auth.onAuthStateChanged(user => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                document.getElementById('user-email').innerText = "Admin: " + user.email;
                loadItems();
            } else if (user) {
                auth.signOut();
                showError("Access Denied: Account (" + user.email + ") is not authorized.");
            } else {
                document.getElementById('login-card').style.display = 'block';
                document.getElementById('admin-content').style.display = 'none';
            }
        });

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).catch(err => {
                showError(err.message);
            });
        }

        function logout() {
            auth.signOut();
        }

        function showError(msg) {
            const errDiv = document.getElementById('login-error');
            errDiv.innerText = msg;
            errDiv.style.display = "block";
        }

        async function loadItems() {
            const list = document.getElementById('items-list');
            list.innerHTML = 'Loading...';
            try {
                const snapshot = await db.collection("items").get();
                if (snapshot.empty) {
                    list.innerHTML = '<div>No items found in database.</div>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const i = doc.data();
                    html += `
                        <div class="item-row">
                            <div>
                                <strong>${i.title}</strong> (${i.type}) - ${i.version}
                            </div>
                            <button class="dots-btn" onclick="toggleMenu(event, '${doc.id}')">⋮</button>
                            <div class="action-menu" id="menu-${doc.id}">
                                <button type="button" onclick="startEdit('${doc.id}')">Edit File</button>
                                <button type="button" class="delete-opt" onclick="deleteItem('${doc.id}')">Delete File</button>
                            </div>
                        </div>
                    `;
                });
                list.innerHTML = html;
            } catch (err) {
                console.error(err);
                list.innerHTML = '<div style="color:red;">Error loading items. Check console.</div>';
            }
        }

        function toggleMenu(event, id) {
            event.stopPropagation();
            document.querySelectorAll('.action-menu').forEach(m => {
                if (m.id !== `menu-${id}`) m.classList.remove('active');
            });
            const menu = document.getElementById(`menu-${id}`);
            menu.classList.toggle('active');
        }

        document.addEventListener('click', () => {
            document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
        });

        async function startEdit(id) {
            const doc = await db.collection("items").doc(id).get();
            if(!doc.exists) return;
            const data = doc.data();

            document.getElementById('edit-id').value = id;
            document.getElementById('title').value = data.title || '';
            document.getElementById('type').value = data.type || 'game';
            document.getElementById('version').value = data.version || '';
            document.getElementById('modInfo').value = data.modInfo || '';
            document.getElementById('iconUrl').value = data.iconUrl || '';
            document.getElementById('downloadUrl').value = data.downloadUrl || '';
            document.getElementById('description').value = data.description || '';

            document.getElementById('form-heading').innerText = "Edit Game/App";
            document.getElementById('submit-btn').innerText = "Update Game/App";
            document.getElementById('cancel-btn').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('add-form').reset();
            document.getElementById('form-heading').innerText = "Add New Game/App";
            document.getElementById('submit-btn').innerText = "Publish to Firebase DB";
            document.getElementById('cancel-btn').style.display = "none";
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const editId = document.getElementById('edit-id').value;
            
            btn.innerText = editId ? 'Updating...' : 'Publishing...';
            btn.disabled = true;

            const payload = {
                title: document.getElementById('title').value,
                type: document.getElementById('type').value,
                version: document.getElementById('version').value,
                modInfo: document.getElementById('modInfo').value,
                iconUrl: document.getElementById('iconUrl').value,
                downloadUrl: document.getElementById('downloadUrl').value,
                description: document.getElementById('description').value,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (editId) {
                    await db.collection("items").doc(editId).update(payload);
                } else {
                    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection("items").add(payload);
                }
                resetForm();
                loadItems();
            } catch (err) {
                alert('Error saving item: ' + err.message);
            } finally {
                btn.disabled = false;
            }
        });

        async function deleteItem(id) {
            if (confirm('Are you sure you want to delete this file?')) {
                try {
                    await db.collection("items").doc(id).delete();
                    loadItems();
                } catch (err) {
                    alert('Error deleting item: ' + err.message);
                }
            }
        }
    </script>
</body>
</html>
